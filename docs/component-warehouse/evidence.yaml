  uses: []
dsio.experimental.execution:calibrate_execution:
  uses:
  - consumer: reference_projects/kaggle/parkinsons_fog
    test: tests/kaggle_portfolio/test_parkinsons_fog.py
    kind: real
    group: parkinsons-fog
    via: dsio.experimental.training:calibrate_training_execution
    runs:
    - https://pop.tailee691f.ts.net:8443/#/experiments/57/runs/553bf319fae2401faf4e8bd1eb63ef73
  - consumer: reference_projects/kaggle/child_mind/sequence
