# Component evidence register (Component Warehouse v1, CAP-8/CAP-9).
#
# One entry per public component callable. Lives outside src/dsio because the admission
# audit rejects consumer names in DSio source. Rules (tools/catalog.py --check):
# - legacy: true  -> pre-1.0 legacy experimental (docs/component-admission.md); must live
#   in dsio.experimental; no docstring sections required yet.
# - otherwise experimental needs >= 1 real use; stable needs >= 2 real uses in distinct
#   `group`s plus `approval`. kind: real (a consumer experiment) | fixture (synthetic).
# - consumer/test paths must exist; runs must be immutable MLflow run URIs.
# - `via` names the component through which a use reaches this one.

dsio.experimental.data.labels:entity_attribute_labels:
  legacy: true
  uses: []
