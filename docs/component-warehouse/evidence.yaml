# Component evidence register (Component Warehouse v1, CAP-8/CAP-9).
#
# One entry per public component callable. Lives outside src/dsio because the admission
# audit rejects consumer names in DSio source. Rules (tools/catalog.py --check):
# - legacy: true  -> pre-1.0 legacy experimental (docs/component-admission.md); only the
#   frozen tools/catalog.py LEGACY list may be legacy, never with a real use.
# - otherwise experimental needs >= 1 real use; stable needs >= 2 real uses in distinct
#   groups plus `approval`. A real use's group is derived from its Kaggle consumer path
#   (reference_projects/kaggle/<group>/...), so both CMI consumers count once.
#   kind: real (a Kaggle consumer) | fixture (synthetic reference).
# - consumer/test paths must exist, the consumer must reference the component (or `via`),
#   and runs must be immutable MLflow run URIs.
# - `via` names the component through which a use reaches this one.

dsio.experimental.data.items:StoredItems:
  approval: owner standing approval for Component Warehouse v1 experimental entries (Epics 7-9), 2026-10-01
  uses:
  - consumer: reference_projects/kaggle/titanic
