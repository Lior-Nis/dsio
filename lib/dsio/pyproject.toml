[project]
name = "dsio"
version = "0.1.0"
description = "Reproducible ML/DL experimentation spine: config, data staging, splits, runs, evaluation."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

# Spine only. Heavy modality dependencies live in optional groups so a fresh clone
# installs in seconds and a Kaggle kernel can install just what it needs.
dependencies = [
    "pydantic>=2.12",
    "typer>=0.15",
    "pyyaml>=6.0",
    "numpy>=2.1",
]

[project.optional-dependencies]
tabular = ["scikit-learn>=1.9", "xgboost>=3.4", "polars>=1.30", "pyarrow>=18"]
forecast = ["statsforecast>=2.1", "mlforecast>=1.1"]
torch = ["torch>=2.6", "lightning>=2.5", "torchmetrics>=1.6"]
data = ["fsspec>=2025.1", "pyarrow>=18"]
# zarr only for reading legacy stores; it is not the canonical format (ADR 0005).
legacy = ["zarr>=3.0"]

[project.scripts]
dsio = "dsio.cli.main:main"

# The spine is developed and tested standalone: `cd lib/dsio && uv sync && uv run pytest`.
# A generated project pulls it in as a workspace member and brings its own dev group.
[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
    "mypy>=1.14",
    "import-linter>=2.1",
    "types-pyyaml>=6.0",
    "scikit-learn>=1.9",
    # fsspec is an optional extra for users, but a required dev dependency: the remote
    # push/pull path must be exercised in CI against a local filesystem, or the fresh-clone
    # reproduction test is only a claim.
    "fsspec>=2025.1",
    # CPU torch, for the same reason as fsspec: the component chain and the Lightning
    # runner must run in CI, which has no GPU. A generated project overrides the source
    # below to get CUDA wheels — uv sources are not propagated to consumers of dsio.
    "torch>=2.6",
    "lightning>=2.5",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "BLE", "SIM", "RUF"]
# BLE is load-bearing: FORGE's swallowed callback exceptions silently disabled
# checkpointing for multi-hour runs. A broad except is a correctness bug, not a style one.

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "BLE", "SIM", "RUF"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dsio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# ---------------------------------------------------------------------------
# The spine is held to a stricter bar than project code. See docs/adr/.
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
files = ["src/dsio"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
disallow_untyped_defs = true

# ---------------------------------------------------------------------------
# Import contracts — each encodes a specific leak, not generic layering.
# ---------------------------------------------------------------------------

[tool.importlinter]
root_packages = ["dsio"]
include_external_packages = true

[[tool.importlinter.contracts]]
# config/runs/artifacts are leaves. If one grows an upward import, the dependency
# direction has inverted and every downstream module becomes untestable in isolation.
name = "Foundation modules import no other dsio module"
type = "independence"
modules = ["dsio.config", "dsio.runs", "dsio.artifacts"]

[[tool.importlinter.contracts]]
# The spine must never depend on a specific project. In the workspace layout this is
# also enforced by packaging — dsio does not declare the project as a dependency — but
# the contract catches an accidental import before it reaches a lockfile.
name = "dsio never imports project code"
type = "forbidden"
source_modules = ["dsio"]
forbidden_modules = ["project"]

[[tool.importlinter.contracts]]
# The fold loop and the artifact contract must stay framework- and modality-agnostic.
# The moment `dsio.eval` can see a WindowIndex or a Run, someone will type one of them
# into a signature, and the loop stops being usable for tabular, forecast and torch alike.
# Dependency points the other way: splits builds folds, runners call the loop.
name = "Evaluation depends on no pipeline layer"
type = "forbidden"
source_modules = ["dsio.eval"]
forbidden_modules = [
    "dsio.data",
    "dsio.splits",
    "dsio.train",
    "dsio.runs",
    "dsio.artifacts",
    "dsio.cli",
]

[[tool.importlinter.contracts]]
# CLI command modules must not import each other. algua added this contract after command
# modules started reaching into each other's private helpers, which is how gating logic
# drifts apart between subcommands.
name = "CLI command modules are mutually independent"
type = "independence"
modules = [
    "dsio.cli.run_cmd",
    "dsio.cli.runs_cmd",
    "dsio.cli.artifacts_cmd",
    "dsio.cli.data_cmd",
    "dsio.cli.splits_cmd",
    "dsio.cli.eval_cmd",
]

[[tool.importlinter.contracts]]
# data/adapters.py used a function-local import to dodge this cycle. The layer
# direction is splits -> data, one way; a local import that hides a cycle is a
# cycle, and the next person to add one will not know it was deliberate.
name = "The data layer never imports splits"
type = "forbidden"
source_modules = ["dsio.data"]
forbidden_modules = ["dsio.splits"]
