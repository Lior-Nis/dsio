[project]
name = "dsio"
version = "0.1.0"
description = "Reproducible ML/DL experimentation spine: config, data staging, splits, runs, evaluation."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

# Spine only. Heavy modality dependencies live in optional groups so a fresh clone
# installs in seconds and a Kaggle kernel can install just what it needs.
dependencies = [
    "pydantic>=2.12",
    "typer>=0.15",
    "pyyaml>=6.0",
    "numpy>=2.1",
]

[project.optional-dependencies]
# Not tabular training any more (that runner is deleted; ADR 0015) — scikit-learn is
# the linear probe's dependency now (`dsio.train.callbacks`), and `tests/eval/
# test_metrics.py` pins the hand-rolled metrics against it. xgboost and polars had no
# importer left in `src/` and are gone.
tabular = ["scikit-learn>=1.9"]
# dsio itself never imports pyarrow — artifacts are npz, deliberately, so the single most
# important artifact in the system stays readable in a bare install (see
# `eval/contract.py`'s "Why npz and not parquet"). Kept as its own extra for a project
# that wants to convert `oof.npz` to parquet itself, not because dsio needs it.
data = ["pyarrow>=18"]
# torch ships one wheel per accelerator, and they cannot coexist in a resolution.
# CI has no GPU and wants the small CPU wheel; a local Blackwell card (sm_120) needs
# a CUDA build or it fails at model-build time with "no kernel image is available
# for execution on the device". Declaring both as conflicting extras lets one
# lockfile serve both: `uv sync --extra cpu` in CI, `uv sync --extra gpu` locally.
# Both carry the full Lightning stack (not just torch) so that neither extra alone,
# nor the dev group, leaves a torch-needing import unresolved: a bare `uv run` with
# no extra selected must fail loudly on a missing import, not silently fall back to
# downloading a multi-gigabyte default wheel.
#
# `mlflow-skinny` lives here too, not in `dependencies`: decision 7 makes MLflow a
# run's hard dependency, but the only code that ever imports it is `dsio.train.tracking`
# and the two runner modules (`torch_task.py`, `ssl_task.py`), which already require
# torch and lightning at module import time -- so a clone with neither extra selected was
# never going to be able to run a training job anyway. Bundling it here, rather than in
# `dependencies`, is what keeps a bare `uv sync` and `tests/data/` torch-free (and now
# MLflow-free) exactly as before; `dsio.train.load_runners()` already tolerates a runner
# module failing to import, so an environment missing this extra just skips registering
# these runners, same as it does today for missing torch. `-skinny` over the full
# `mlflow` package: only the tracking client is needed locally (the server itself runs
# from the official image in `docker/mlflow`, which already bundles full `mlflow`), and
# skinny drops the server/UI/flask/sqlalchemy/gunicorn dependency chain that a training
# process never touches.
cpu = ["torch>=2.7", "lightning>=2.5", "mlflow-skinny>=2.19"]
gpu = ["torch>=2.7", "lightning>=2.5", "mlflow-skinny>=2.19"]

[project.scripts]
dsio = "dsio.cli.main:main"

# dsio is one package, developed and tested in place: `uv sync --extra cpu && uv run pytest`.
# There is no separate generated project and no workspace; this dev group is the only one.
[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
    "mypy>=1.14",
    "import-linter>=2.1",
    "types-pyyaml>=6.0",
    "scikit-learn>=1.9",
]

# torch and lightning are declared only in the cpu/gpu extras (above), not here.
# A bare `uv sync` with no extra selected must leave torch and lightning uninstalled,
# so that a bare `uv run pytest` fails loudly on ModuleNotFoundError instead of
# silently resolving an unpinned, CUDA-bundled default wheel for the "no extra" fork.
[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# No index is declared for the gpu extra: the default PyPI torch wheel for this
# platform is already CUDA-enabled (2.13.0+cu130, newer than the pytorch-cu128
# index's 2.11.0+cu128), so pinning to a specific CUDA index would make the gpu
# extra resolve an *older* torch than the unpinned default — the wrong direction.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "cpu" }]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# docs/adr/*.py are frozen benchmark evidence committed alongside an ADR: each is a
# single, never-amended commit, not shipped code under active maintenance. They were
# invisible to ruff before the move because ruff ran with lib/dsio as its working
# directory; running from the repository root would otherwise sweep them in for the
# first time. Scoped to docs/adr specifically so the rest of docs/ (docs/superpowers/
# and any future subtree) stays linted.
extend-exclude = ["docs/adr"]
# Without this, `ruff check docs/adr` (an explicit path argument) would still lint
# the excluded files — exclude/extend-exclude only apply during directory traversal
# by default. Force it so the boundary holds no matter how ruff is invoked.
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "BLE", "SIM", "RUF"]
# BLE is load-bearing: FORGE's swallowed callback exceptions silently disabled
# checkpointing for multi-hour runs. A broad except is a correctness bug, not a style one.

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "BLE", "SIM", "RUF"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dsio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `live` tests need the compose stack (`docker compose up -d`; compose.yaml) and are
# excluded by default so `uv run --extra cpu pytest` keeps passing on a machine with
# nothing running -- the plan's "the suite must not need Docker" constraint. Run them
# explicitly with `uv run --extra cpu pytest -m live`.
markers = [
    "live: needs the local MLflow/Postgres compose stack; excluded by default",
]
addopts = "-m 'not live'"

# ---------------------------------------------------------------------------
# The spine is held to a stricter bar than project code. See docs/adr/.
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
files = ["src/dsio"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
disallow_untyped_defs = true

# ---------------------------------------------------------------------------
# Import contracts — each encodes a specific leak, not generic layering.
# ---------------------------------------------------------------------------

[tool.importlinter]
root_packages = ["dsio"]
include_external_packages = true

[[tool.importlinter.contracts]]
# config/runs are leaves. If one grows an upward import, the dependency direction has
# inverted and every downstream module becomes untestable in isolation. `dsio.artifacts`
# was the third leaf; it is gone, and the encoder handoff it held now lives beside its
# only two callers in `dsio.train.artifacts`, which is not a leaf and does not claim to be.
name = "Foundation modules import no other dsio module"
type = "independence"
modules = ["dsio.config", "dsio.runs"]

[[tool.importlinter.contracts]]
# The fold loop and the artifact contract must stay framework-agnostic -- not because
# several frameworks are first-class any more (ADR 0015 narrowed that to Lightning) but
# because `cross_validate`'s `FitPredict` contract is also what the plain, deliberately
# un-abstracted tabular baseline script ADR 0015 keeps reachable would drive, and because
# a fold loop that cannot be constructed or tested without a WindowIndex or a Run is no
# longer simple to test in isolation. The moment `dsio.eval` can see either, someone will
# type one into a signature.
# Dependency points the other way: splits builds folds, runners call the loop.
name = "Evaluation depends on no pipeline layer"
type = "forbidden"
source_modules = ["dsio.eval"]
forbidden_modules = [
    "dsio.data",
    "dsio.dataset",
    "dsio.splits",
    "dsio.model",
    "dsio.train",
    "dsio.runs",

    "dsio.cli",
]

[[tool.importlinter.contracts]]
# data/adapters.py used a function-local import to dodge this cycle. The layer
# direction is splits -> data, one way; a local import that hides a cycle is a
# cycle, and the next person to add one will not know it was deliberate.
name = "The data layer never imports splits"
type = "forbidden"
source_modules = ["dsio.data", "dsio.dataset"]
forbidden_modules = ["dsio.splits"]

[[tool.importlinter.contracts]]
# dsio.testing exists to be imported by a *project's* test suite, not by dsio. If the
# spine imports it, test-only helpers acquire production consumers — and the contract
# suites, which deliberately spawn processes and pickle payloads to prove a bug, end up
# reachable from a training run.
name = "The spine never imports its own contract suites"
type = "forbidden"
source_modules = [
    "dsio.config",
    "dsio.contracts",
    "dsio.data",
    "dsio.dataset",
    "dsio.splits",
    "dsio.eval",
    "dsio.model",
    "dsio.train",
    "dsio.runs",

    "dsio.cli",
]
forbidden_modules = ["dsio.testing"]
