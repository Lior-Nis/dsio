name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  spine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Provenance tests need real history; a shallow clone breaks rev-parse.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked --extra cpu

      - name: Tests
        run: uv run --extra cpu pytest

      - name: Lint
        run: uv run --extra cpu ruff check .

      - name: Types
        run: uv run --extra cpu mypy

      - name: Import contracts
        run: uv run --extra cpu lint-imports
