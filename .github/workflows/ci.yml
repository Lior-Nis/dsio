name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  spine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Provenance tests need real history; a shallow clone breaks rev-parse.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked --group benchmark

      - name: Build distributions
        run: uv build

      - name: Distribution and consumer-flow contracts
        run: >-
          uv run pytest -q
          tests/test_distribution.py
          tests/test_built_distribution.py
          tests/test_project_flow.py

      - name: Tests
        run: >-
          uv run pytest
          --ignore=tests/test_distribution.py
          --ignore=tests/test_built_distribution.py
          --ignore=tests/test_project_flow.py

      - name: Lint
        run: uv run ruff check .

      - name: Types
        run: uv run mypy

      - name: Import contracts
        run: uv run lint-imports
