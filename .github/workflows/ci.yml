name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  spine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Provenance tests need real history; a shallow clone breaks rev-parse.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # I4: tests/ops/test_backup.py's two functional tests -- the only executing
      # evidence for the backup's append-only property (`rclone copy`, never `sync`),
      # whose failure mode is unrecoverable data loss -- skip themselves whenever
      # `shutil.which("rclone")` finds nothing, and CI installed only `uv`. That left
      # zero executing coverage here even though `test_script_uses_copy_not_sync`'s
      # static grep alone cannot catch every regression (see that test's own docstring
      # and this step's sibling comment in tests/ops/test_backup.py).
      - name: Install rclone
        run: sudo apt-get update && sudo apt-get install -y rclone

      - name: Install
        run: uv sync --locked --extra cpu

      - name: Tests
        run: uv run --extra cpu pytest

      - name: Lint
        run: uv run --extra cpu ruff check .

      - name: Types
        run: uv run --extra cpu mypy

      - name: Import contracts
        run: uv run --extra cpu lint-imports
